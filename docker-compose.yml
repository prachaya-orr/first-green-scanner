services:
  scanner:
    build:
      context: .
      dockerfile: Dockerfile
    image: first-green-scanner:latest
    container_name: first-green-scanner
    ports:
      - "8501:8501"
    environment:
      # override ได้ตามต้องการ เช่น เปลี่ยน port หรือ theme
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health').status==200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
